# binnacle CI. End-to-end dependency graph:
#   secret scan → build (make check) → gate (main only)
#                                   └→ docs (build; publish on main only)
# The gitleaks workflow is shared from stump.wtf/ci so the ruleset stays
# uniform across the org. Jobs are separately named because the Gitea Actions
# log API 404s on this instance — job granularity is often the only signal
# about what failed.
name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # 1. secret scan — a leaked credential fails the PR rather than landing
  secrets:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/gitleaks.yaml@main
    secrets: inherit

  # 2. lint + test via the same make targets run locally.
  #    make lint shells out to gitleaks, which the runner image does not ship —
  #    install the pinned release so local and CI run the same scanner version.
  build:
    needs: [secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned gitleaks (make lint dependency)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: make check

  # 3. docs site → Gitea Pages (https://stump-wtf.pages.stump.rocks/binnacle/)
  #
  # Deliberately NOT behind the main-only gate below. The shared workflow
  # already refuses to publish from anything but the default branch, so hanging
  # it off `build` instead means a PR still *builds* the site — which is the
  # check that actually earns its keep, because a docs build breaks on content
  # (bad frontmatter, a broken cross-reference) far more often than on config,
  # and finding that after merge means main is red for a docs typo.
  #
  # node 22 matches the build job above rather than inheriting the shared
  # default, so the whole repo is on one toolchain. Docusaurus is genuinely
  # version-sensitive here — harness pins 20 because node 23 fails outright on
  # ProgressPlugin validation — so this is stated, not assumed. 22 is verified:
  # a cold `npm ci && npm run build` is green on it.
  #
  # Requires PAGES_ACCESS_KEY_ID / PAGES_SECRET_ACCESS_KEY in this repo's
  # Actions secrets, provisioned from stumpcloud/ansible's pages.users list
  # (stumpcloud/ansible#381). Until that play runs, this job builds green and
  # fails on the deploy step with "Garage does not support anonymous access
  # yet" — rclone falling back to anonymous, which names the symptom and not
  # the missing secret.
  docs:
    needs: [build]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: docs-site
      source_dir: docs-site/build
      site_url: https://stump-wtf.pages.stump.rocks
      node_version: "22"
    secrets: inherit

  # 4. single explicit gate for main-only jobs to hang off later
  #    (container image build + deploy arrive with the bootstrap story)
  main-only:
    needs: [build]
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "on main with a green build — publishing"
