# binnacle CI. End-to-end dependency graph:
#   secret scan → build (make check) → gate (main only)
#                                   └→ docs (build; publish on main only)
# The gitleaks workflow is shared from stump.wtf/ci so the ruleset stays
# uniform across the org. Jobs are separately named because the Gitea Actions
# log API 404s on this instance — job granularity is often the only signal
# about what failed.
name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  # 1. secret scan — a leaked credential fails the PR rather than landing
  secrets:
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/gitleaks.yaml@main
    secrets: inherit

  # 2. Elixir checks — format, compile --warnings-as-errors, tests. Run inside
  #    the pinned elixir container so the toolchain is the exact image the
  #    Makefile falls back to locally and the release stage builds from; the
  #    same mix commands `make check` wraps. (Job-container rather than
  #    docker-run wrappers: the runner's job containers have workspace paths
  #    the host docker daemon cannot volume-mount.)
  test:
    needs: [secrets]
    runs-on: ubuntu-latest
    container: elixir:1.20-alpine@sha256:89d8a6f92b631d9916261371ffaf10589a57d08c5487cd042c884f1fd89ae6fb
    steps:
      # actions/checkout runs on node, and the runner executes JS actions
      # inside the job container — the stock elixir image has neither node
      # nor git. Install both before the checkout step. working-directory
      # is set per-step (not as a job default) because the workspace path
      # does not exist until after checkout.
      - name: Install node + git (for actions/checkout)
        run: apk add --no-cache nodejs git
      - uses: actions/checkout@v4
      - name: Install hex + rebar
        run: mix local.hex --force && mix local.rebar --force
        working-directory: server
      - name: Fetch deps
        run: mix deps.get
        working-directory: server
      - name: Format check
        run: mix format --check-formatted
        working-directory: server
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
        working-directory: server
      - name: Tests
        run: mix test
        working-directory: server

  # 3. asset bundle — Vite/Tailwind in the node container, the same
  #    `make server-build` target run locally.
  build:
    needs: [secrets]
    runs-on: ubuntu-latest
    # node:22 (full, not -alpine) because the npm resolution of the asset
    # tree shells out to git for at least one dependency.
    container: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
    steps:
      - uses: actions/checkout@v4
      - name: Build asset bundle
        run: make server-build
  docs:
    needs: [build, test]
    uses: https://gitea.stump.rocks/stump.wtf/ci/.gitea/workflows/static-site.yaml@main
    with:
      working_directory: docs-site
      source_dir: docs-site/build
      site_url: https://stump-wtf.pages.stump.rocks
      node_version: "22"
    secrets: inherit

  # 4. single explicit gate for main-only jobs to hang off later
  #    (container image build + deploy arrive with the bootstrap story)
  main-only:
    needs: [build, test]
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "on main with a green build — publishing"
