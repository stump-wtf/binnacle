# Build, scan and publish the binnacle container image to
# gitea.stump.rocks/stump.wtf/binnacle.
#
# Modeled on stump.wtf/rack-planner's build.yaml.
#
# The Gitea package MUST stay public once it exists: DUB hosts pull
# anonymously — there is no host-side registry auth anywhere in
# stumpcloud/ansible (see the rack-planner header for the same constraint),
# and dub.yaml's binnacle entry pulls :latest with pull: always.
#
# Registry auth on this Gitea (< 1.26): the automatic per-run token is
# REJECTED by the container registry, so a real PAT with write:package scope
# is required. conf.actions.repos in dub.yaml hardcodes owner: stumpcloud, so
# it cannot provision this repo's REGISTRY_TOKEN — like cairn, switchboard
# and rack-planner, a stump.wtf repo sets that secret by hand. Every registry
# step is guarded on it so the workflow skips green until the secret exists.
#
# :latest is tagged on the main ref only — but by ref, not by event, so a
# workflow_dispatch ON MAIN still publishes it. That is the bootstrap path
# this incident needs (stumpcloud/stumpcloud#247): the FIRST image can ship
# without waiting for a merge. Gating on the ref rather than tagging
# unconditionally keeps a dispatch from a feature branch from overwriting the
# tag the DUB hosts pull with pull: always. Every push also records a
# sha-<short> tag for rollbacks.
#
# Pull requests build and scan but never log in or push (rack-planner's
# shape): a Dockerfile that cannot build is caught on the PR instead of
# breaking the publish after merge and leaving :latest stale.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + scan + push
    runs-on: ubuntu-latest
    env:
      # Step-level `if: env.REG != ''` gates the whole job on the secret
      # (secrets cannot be used in `if` directly). No token -> every step
      # skips -> job is green.
      REG: ${{ secrets.REGISTRY_TOKEN }}
      IMAGE: gitea.stump.rocks/stump.wtf/binnacle
    steps:
      - if: ${{ env.REG != '' }}
        uses: actions/checkout@v4

      - if: ${{ env.REG != '' }}
        name: Set metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - if: ${{ env.REG != '' }}
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: ${{ env.REG != '' && gitea.event_name != 'pull_request' }}
        name: Log in to Gitea
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.REGISTRY_TOKEN }}

      - if: ${{ env.REG != '' }}
        name: Build image (amd64, for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan-${{ gitea.run_id }}
          build-args: BUILD_SHA=${{ gitea.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # Container Smoke Test
      #
      # `docker build` only proves the layers assemble; it never proves the
      # release starts. Three boot-breaking defects reached main under a green
      # build because of that gap: a missing `MIX_ENV=prod` (#36), a missing
      # `ncurses-libs` so `beam.smp` exited 127, and a cwd-relative
      # `priv/fleet/baseline.json` that only resolves under `mix phx.server`
      # (both #37). Each one fails here, on the PR that introduces it.
      #
      # Runs on pull_request as well as push: the build above is `load: true`
      # on every event, so the scan tag is a local image regardless of whether
      # the registry push is gated off.
      #
      # Probes `/`, not `/healthz`, to match the Dockerfile HEALTHCHECK —
      # there is no health route yet. If one is ever added, change both.
      #
      # @joestump-agent 08/19/2026 - Added the smoke test between the build
      # and the Trivy scan. Boot is the cheaper and more fundamental signal,
      # so it runs first: a release that cannot start is not worth scanning.
      - if: ${{ env.REG != '' }}
        name: Smoke test (container boots and serves /)
        shell: bash
        run: |
          # The runner renders `shell: bash` as `bash --noprofile --norc -e -o
          # pipefail`, so `-e` is on before this script starts and an in-script
          # `set -u` does not clear it. Left alone it aborts the step on the
          # first refused connection — before any diagnostics. Turn it off
          # deliberately and check exit codes by hand.
          set +e
          set -uo pipefail

          image="${IMAGE}:scan-${{ gitea.run_id }}"
          name="binnacle-smoke-${{ gitea.run_id }}"

          # The probe runs INSIDE the container, not against a published host
          # port. This runner executes job steps inside a job container on its
          # own bridge network, so `127.0.0.1:<published-port>` from the step
          # never reaches the smoke container — curl sat at 000 while the
          # container happily served 200 to its own HEALTHCHECK. `wget` is
          # already in the image (the HEALTHCHECK uses it), so `docker exec`
          # probes the real listener with zero network plumbing. The URL
          # matches the HEALTHCHECK's in-container target, port 8080.
          url="http://127.0.0.1:8080/"

          # Trapped rather than deferred to an `if: always()` step, so the
          # container never outlives this step on any exit path — including a
          # cancelled run.
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT INT TERM

          # Every failure path goes through here, so the logs are never lost
          # to an early exit.
          fail() {
            echo "::error::$1"
            echo "--- docker ps -a ---"
            docker ps -a -f "name=^${name}$"
            echo "--- docker logs ---"
            docker logs "$name" 2>&1
            exit 1
          }

          docker run -d --name "$name" "$image" >/dev/null \
            || fail "docker run failed for ${image}"

          echo "probing ${url} (in-container)"
          deadline=$((SECONDS + 30))
          status=000
          while [ "$SECONDS" -lt "$deadline" ]; do
            # wget prints the response body; HTTP errors turn into a non-zero
            # exit, so success == exit 0 == a served 200 on /.
            if docker exec "$name" wget -qO- --timeout=3 "$url" >/dev/null 2>&1; then
              status=200
            else
              status=000
            fi
            if [ "$status" = 200 ]; then
              echo "container served HTTP 200 on / after ${SECONDS}s"
              exit 0
            fi
            # An already-exited container will never answer. Stop burning the
            # timeout and go straight to the logs.
            if [ -z "$(docker ps -q -f "name=^${name}$")" ]; then
              fail "container exited before serving a request"
            fi
            sleep 1
          done

          fail "image never served HTTP 200 on / within 30s (last status: ${status})"

      - if: ${{ env.REG != '' }}
        name: Trivy image scan
        uses: docker://aquasec/trivy:latest@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        with:
          args: image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --skip-version-check --format table ${{ env.IMAGE }}:scan-${{ gitea.run_id }}

      - if: ${{ env.REG != '' && gitea.event_name != 'pull_request' }}
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_SHA=${{ gitea.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ---- deploy ---------------------------------------------------------------
  #
  # On-merge deploy to ie02, mirroring the pattern stump.wtf/cairn already uses
  # for cloud01. Until this existed binnacle had no deploy step at all: the
  # `main-only` job in pipeline.yaml is a placeholder that echoes a line, and
  # its comment says the deploy "arrives with the bootstrap story". So merging
  # to main built and pushed a new :latest that nothing ever pulled, and the
  # running container drifted however many merges behind until somebody ran the
  # playbook by hand. On 2026-08-21 that gap held a completely unstyled site
  # live for the better part of an hour after the fix for it had already
  # merged, green.
  #
  # This is the one place binnacle departs from ADR-0002's ansible-pull model,
  # and it is opt-in exactly as cairn's is: inert until the repo variable
  # DEPLOY_ON_MERGE is set to true, so it can land before the credentials it
  # needs exist and simply skip until they do.
  #
  # @joestump 08/21/2026 - Added after the unstyled-site incident.
  deploy:
    name: deploy to ie02 (ansible)
    needs: [image]
    if: ${{ vars.DEPLOY_ON_MERGE == 'true' && gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Serialize against other deploys of this service. A second merge landing
    # mid-converge would have two ansible runs writing the same compose file
    # and secret files on ie02 at once.
    concurrency:
      group: binnacle-deploy-ie02
      cancel-in-progress: false
    env:
      ANSIBLE_FORCE_COLOR: 'true'
      # binnacle's baseline embeds per-node PVE API tokens and its API token
      # lives at secret/data/ie02/binnacle, so the play needs vault. AppRole,
      # not a static VAULT_TOKEN: a static token cannot re-authenticate, dies
      # at max-TTL, and takes every later deploy with it silently — the
      # 2026-07-01 vault-agent OMG, repeated in CI. The runner logs in per run
      # for a short-lived token scoped to secret/data/ie02/* (policy
      # deploy-ie02).
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
      # The service role's dns_cname tasks talk to Route53.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # `docker compose pull` of an Elixir release image over the LAN is well
      # inside this, but the default is not.
      DOCKER_TIMEOUT: 600
    steps:
      - name: Checkout stumpcloud/ansible (playbooks + inventory)
        uses: actions/checkout@v4
        with:
          repository: stumpcloud/ansible
          ref: main
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Log in to Gitea (pull the ansible-runner action image)
        uses: docker/login-action@v3
        with:
          registry: gitea.stump.rocks
          username: joestump-agent
          password: ${{ secrets.GIT_AUTH_TOKEN }}

      # v2.1.0 exactly, not @v2: ssh_private_key became a real delivered input
      # in v2.1.0, and earlier versions silently discarded it — which is how
      # cairn's deploy job spent its whole life red on "Permission denied
      # (publickey)". Do not tidy this back to the major alias without checking
      # what it points at.
      #
      # No ssh-agent step: the agent's socket would live in this job's
      # container while ansible-playbook runs inside the action's container,
      # and the two never meet. ssh_private_key is what actually reaches
      # ansible.
      - name: Deploy binnacle to ie02
        uses: https://gitea.stump.rocks/stumpcloud/ansible-runner@51b328c2da9dd312eb11a71fa07da41c338a754b # v2.1.1
        with:
          playbook: playbooks/services/binnacle.yaml
          inventory: dub.yaml
          ssh_hosts: ie02.stump.rocks
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The deploy is only worth anything if the thing now running is the thing
      # that was just built. Checking the footer SHA alone is not enough — the
      # unstyled-site incident had a correct SHA on a page with no stylesheet —
      # so assert the stylesheet the release serves actually carries utilities.
      - name: Verify the running build
        run: |
          set -eu
          for i in $(seq 1 30); do
            live=$(curl -fsS https://binnacle.stump.rocks/ 2>/dev/null \
                   | grep -o 'commit/[0-9a-f]\{40\}' | head -1 | cut -d/ -f2) || true
            if [ "${live:-}" = "${GITHUB_SHA}" ]; then
              css=$(curl -fsS https://binnacle.stump.rocks/assets/app.css)
              case "$css" in
                *".flex{"*) echo "deployed ${GITHUB_SHA} and serving a styled page"; exit 0 ;;
                *) echo "::error::${GITHUB_SHA} is live but /assets/app.css has no utilities"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::binnacle did not come up on ${GITHUB_SHA} within 5 minutes (still on ${live:-unknown})"
          exit 1
